[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "coverage>=7.17.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.162.0",
    "pytest>=9.1.1",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
coverage-suite = "scripts.run_coverage:main"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
