name: Deploy to Render

on:
  push:
    branches: [main]

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger backend deploy
        env:
          HOOK_URL: ${{ secrets.RENDER_BACKEND_HOOK_URL }}
        run: |
          test -n "$HOOK_URL"
          curl --fail --silent --show-error --request POST \
            --url-query "ref=$GITHUB_SHA" "$HOOK_URL"

      - name: Trigger frontend deploy
        env:
          HOOK_URL: ${{ secrets.RENDER_FRONTEND_HOOK_URL }}
        run: |
          test -n "$HOOK_URL"
          curl --fail --silent --show-error --request POST \
            --url-query "ref=$GITHUB_SHA" "$HOOK_URL"
